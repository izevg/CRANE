# Single node (раздел 16.1 docs/product): caddy, crane (роль all), postgres, локальный том blobs.
# Запуск из корня репозитория: cp .env.dist .env, создать файлы секретов (см. .env.dist), затем
#   docker compose --project-directory . -f deploy/compose/docker-compose.yaml up -d
# `--project-directory .` обязателен: пути в файлах (./deploy/caddy, ./secrets) и .env считаются от корня, а не от deploy/compose.
# Значения только из .env; пропущенная переменная останавливает запуск.
# Секреты (токен, пароль PostgreSQL, URL каталога) лежат в файлах и монтируются в /run/secrets:
# ни в переменных окружения, ни в этом файле их нет.
# Профиль: scan (analyzer + trivy). Остальные режимы описаны override-файлами, а не профилями:
# они меняют настройку самого crane (ключи, сети, зависимости). Подключаются через COMPOSE_FILE (строка в .env)
# или несколькими -f:
#   deploy/compose/docker-compose.s3.yaml     S3 (SeaweedFS) вместо локального тома blobs
#   deploy/compose/docker-compose.cache.yaml  Valkey с обязательной аутентификацией в изолированной сети cache
#   COMPOSE_FILE=deploy/compose/docker-compose.yaml:deploy/compose/docker-compose.s3.yaml:deploy/compose/docker-compose.cache.yaml
# По умолчанию single-node работает с кэшем memory (CRANE_CACHE не задан) и локальным томом, секретов Valkey и S3 не требует.
name: crane

x-crane: &crane
  image: ${CRANE_IMAGE:?}:${CRANE_VERSION:?}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  # URL каталога целиком (с паролем) лежит в секрете; сервер читает его через CRANE_DATABASE_URL_FILE.
  secrets: [database_url]
  environment: &crane-env
    CRANE_DATABASE_URL_FILE: /run/secrets/database_url
    CRANE_BLOBS: ${CRANE_BLOBS:?}

services:
  caddy:
    image: ${CADDY_IMAGE:?}
    restart: unless-stopped
    networks: [edge]
    ports: ["${CADDY_HTTP_PORT:?}:80", "${CADDY_HTTPS_PORT:?}:443"]
    environment:
      CRANE_HOST: ${CRANE_HOST:?}
      CRANE_HTTP_PORT: ${CRANE_HTTP_PORT:?}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [crane]

  # Миграции отдельной ролью: advisory lock исключает параллельный запуск.
  migrate:
    <<: *crane
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  crane:
    <<: *crane
    command: ["all"]
    # CRANE_TOKEN рядом с CRANE_TOKEN_FILE задавать нельзя: сервер не стартует.
    environment:
      <<: *crane-env
      # Caddy обслуживает ровно это имя, поэтому адрес выводится из CRANE_HOST.
      CRANE_PUBLIC_URL: https://${CRANE_HOST:?}
      CRANE_TOKEN_FILE: /run/secrets/crane_token
      CRANE_TOKEN_PRINCIPAL: ${CRANE_TOKEN_PRINCIPAL:?}
      # Список имён proxy-репозиториев crates.io через запятую; пусто — proxy выключен.
      CRANE_CARGO_PROXY_REPOS: ${CRANE_CARGO_PROXY_REPOS:-}
      # Hosted и proxy-репозитории npm (registry.npmjs.org) через запятую; пусто — не создаются.
      CRANE_NPM_REPOS: ${CRANE_NPM_REPOS:-}
      CRANE_NPM_PROXY_REPOS: ${CRANE_NPM_PROXY_REPOS:-}
      # Резервирование внутренних имён (`формат:шаблон[=uuid]` через запятую): proxy их не отдаёт никогда.
      CRANE_NAMESPACES: ${CRANE_NAMESPACES:-}
      # Сеть edge делят только caddy и crane: из неё верим X-Forwarded-For. Порт admin не публикуется.
      CRANE_TRUSTED_PROXIES: ${CRANE_EDGE_SUBNET:?}
    secrets: [database_url, crane_token]
    networks: [default, edge]
    volumes: [blobs:/data/blobs]
    deploy:
      resources:
        limits: { cpus: "${CRANE_CPUS:?}", memory: "${CRANE_MEMORY:?}" }
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "crane", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  analyzer:
    <<: *crane
    profiles: [scan]
    command: ["analyze"]
    environment:
      <<: *crane-env
      CRANE_TRIVY_URL: ${CRANE_TRIVY_URL:?}
    # Изолированная сеть: только trivy, наружу выхода нет.
    networks: [scan]
    depends_on: [trivy]

  trivy:
    profiles: [scan]
    image: ${TRIVY_IMAGE:?}
    restart: unless-stopped
    command: ["server", "--listen", "0.0.0.0:4954"]
    networks: [scan, default]
    volumes: [trivy:/root/.cache/trivy]

  postgres:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?}
    secrets: [postgres_password]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10


networks:
  scan:
    internal: true
  # Только caddy и crane: подсеть фиксирована, потому что это же значение CRANE_TRUSTED_PROXIES.
  edge:
    ipam:
      config: [{ subnet: "${CRANE_EDGE_SUBNET:?задайте CRANE_EDGE_SUBNET}" }]

secrets:
  crane_token:
    file: ${CRANE_TOKEN_SECRET:?задайте CRANE_TOKEN_SECRET}
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET:?задайте POSTGRES_PASSWORD_SECRET}
  database_url:
    file: ${CRANE_DATABASE_URL_SECRET:?задайте CRANE_DATABASE_URL_SECRET}

volumes:
  pg:
  blobs:
  trivy:
  caddy-data:
