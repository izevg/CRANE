# S3-режим (раздел 16.1 docs/product): SeaweedFS вместо локального тома blobs.
# Это override к docker-compose.yaml, а не профиль: он меняет настройку самого crane (ключи, зависимости,
# тома), а профиль так не умеет. Подключение, одним из двух способов:
#   COMPOSE_FILE=deploy/compose/docker-compose.yaml:deploy/compose/docker-compose.s3.yaml      (строка в .env)
#   docker compose --project-directory . -f deploy/compose/docker-compose.yaml -f deploy/compose/docker-compose.s3.yaml up -d
# (`--project-directory .` нужен в обоих способах: пути и .env считаются от корня репозитория)
# Нужны файлы секретов S3_ACCESS_KEY_ID_SECRET и S3_SECRET_ACCESS_KEY_SECRET (`task secrets:init` создаёт их) и CRANE_BLOBS=s3://<S3_BUCKET>?endpoint=http://seaweedfs:8333&allow_http=true.
# Ключи S3 лежат только в файлах: в окружении, в URL и в аргументах команд их нет.

services:
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?}
    restart: unless-stopped
    # Анонимного доступа нет. Политику (кому что можно) держит compose, а не файл секрета: файл secrets-init
    # не перезаписывает, и правка политики не дошла бы до работающих установок. Ключ читается из файлов секретов
    # в identities во временном файле (0600) контейнера: ни в argv weed, ни в окружение, ни в журнал он не попадает.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        umask 077
        printf '{"identities":[{"name":"crane","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$(cat /run/secrets/s3_access_key_id)" "$$(cat /run/secrets/s3_secret_access_key)" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    secrets: [s3_access_key_id, s3_secret_access_key]
    volumes: [s3:/data]
    networks: [s3]
    healthcheck:
      # Порт S3 открыт, а master уже выдаёт fid (и заодно создаёт тома). Только порта мало: первая запись,
      # пришедшая раньше первого assign, зависает на минуту, и /healthz/ready у crane не укладывается в 1,5 с.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 && wget -q -O /dev/null http://127.0.0.1:9333/dir/assign"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Одноразово создаёт бакет: /healthz/ready у crane проверяет хранилище blob, без бакета crane не станет healthy.
  seaweedfs-init:
    image: ${SEAWEEDFS_IMAGE:?}
    restart: "no"
    networks: [s3]
    environment:
      BUCKET: ${S3_BUCKET:?задайте S3_BUCKET}
    # Идемпотентно: повторный `s3.bucket.create` на существующем бакете печатает ошибку, поэтому сначала список.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        shell() { printf '%s\n' "$$1" | weed shell -master=seaweedfs:9333 2>/dev/null; }
        i=0
        while [ "$$i" -lt 30 ]; do
          if shell s3.bucket.list | grep -q "^ *$$BUCKET[[:space:]]"; then exit 0; fi
          shell "s3.bucket.create -name $$BUCKET" >/dev/null || true
          i=$$((i + 1))
          sleep 2
        done
        echo "бакет $$BUCKET не создан" >&2
        exit 1
    depends_on:
      seaweedfs: { condition: service_healthy }

  crane:
    environment:
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
    secrets: [database_url, crane_token, s3_access_key_id, s3_secret_access_key]
    networks: [default, edge, s3]
    # В S3-режиме локальный том blobs не нужен: CAS один, и он на S3.
    volumes: !reset []
    depends_on:
      seaweedfs-init: { condition: service_completed_successfully }

networks:
  # Только crane и seaweedfs: наружу SeaweedFS не ходит, crane выходит через default и edge.
  s3:
    internal: true

secrets:
  s3_access_key_id:
    file: ${S3_ACCESS_KEY_ID_SECRET:?задайте S3_ACCESS_KEY_ID_SECRET}
  s3_secret_access_key:
    file: ${S3_SECRET_ACCESS_KEY_SECRET:?задайте S3_SECRET_ACCESS_KEY_SECRET}

volumes:
  s3:
