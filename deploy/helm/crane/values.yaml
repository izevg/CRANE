image:
  repository: crane/crane
  # По умолчанию appVersion чарта
  tag: ""
  # Digest индекса образа (`sha256:…`). Если задан, образ ссылается как repository:tag@digest и выбирает его digest.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Внешние сервисы организации (PostgreSQL, Valkey, S3 не входят в чарт).
# Секрет создаётся вне чарта (external-secrets, sealed-secrets или вручную), его ключи попадают в окружение пода.
# Обязательны для роли serve (без любого из них под не стартует):
#   CRANE_DATABASE_URL (или CRANE_DATABASE_URL_FILE) - каталог, `postgres://…` либо `memory`;
#   CRANE_PUBLIC_URL    - внешний адрес консоли и API (`https://…`, без логина и пароля);
#   CRANE_TOKEN (или CRANE_TOKEN_FILE) - временный статический токен до v0.4.0;
#   CRANE_BLOBS         - хранилище blob (`s3://бакет?endpoint=…`, `file:///…`; можно и через config.blobs ниже).
# Роли migrate нужен только CRANE_DATABASE_URL. По необходимости: CRANE_CACHE (или CRANE_CACHE_FILE), CRANE_SETTINGS_KEY,
# CRANE_TRUSTED_PROXIES. Ключ вида X и X_FILE одновременно задавать нельзя.
# Требования к PostgreSQL: 17+, pgvector >= 0.8, pg_trgm. `crane migrate` создаёт расширения сам, если у роли есть права:
# vector недоверенное (нужен суперпользователь), pg_trgm доверенное (хватает CREATE на базе). Иначе администратор заранее
# выполняет `CREATE EXTENSION vector; CREATE EXTENSION pg_trgm;`, а migrate без них не стартует.
# Требования к внешнему Valkey: `maxmemory` и `maxmemory-policy allkeys-lru` (ключи артефактов живут без TTL).
existingSecret: ""
# Несекретные значения для окружения пода; пусто — переменная не задаётся. Значение здесь видно в манифесте и в
# `helm get values`, поэтому URL с паролем сюда нельзя: адрес Valkey с паролем — только в Secret
# (ключ CRANE_CACHE или CRANE_CACHE_FILE). Переменная пода перекрывает Secret, так что непустой `config.cache`
# отменил бы адрес из Secret. Без CRANE_CACHE кэш `memory` (отдельный у каждой реплики).
config:
  cache: ""
  blobs: ""

# Bootstrap-токен мастера первого запуска (20.5). Рекомендуемый путь: секрет генерирует развёртывание, чарт
# монтирует его файлом и задаёт CRANE_BOOTSTRAP_TOKEN_FILE. Без него (и без CRANE_TOKEN) токен печатается в журнал
# на первом старте, а журнал могут собирать во внешнюю систему. Не задавайте в existingSecret одновременно
# CRANE_BOOTSTRAP_TOKEN: X и X_FILE взаимоисключающие.
# Пример: kubectl create secret generic crane-bootstrap --from-literal=token="crb_$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
bootstrapToken:
  # Имя Secret с токеном; пусто - не монтировать.
  secretName: ""
  # Ключ в Secret; файл появится как /run/secrets/bootstrap/<key>.
  key: token

ports:
  http: 8080
  admin: 9464

api:
  replicas: 2
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 1Gi }

# Миграции: Job в pre-install/pre-upgrade hook
migrate:
  enabled: true

service:
  type: ClusterIP
  port: 80

# Ingress, которому доверяют (CRANE_TRUSTED_PROXIES), обязан перезаписывать X-Request-Id: docs/product/16-deployment.md, раздел 16.2.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: crane.example.com
  tls: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
