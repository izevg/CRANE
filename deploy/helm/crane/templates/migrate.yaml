{{- if .Values.migrate.enabled }}
{{- $ctx := dict "root" . "component" "migrate" "role" "migrate" }}
{{- $pod := include "crane.podspec" $ctx | fromYaml }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "crane.fullname" . }}-migrate
  labels: {{ include "crane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {{ include "crane.selector" $ctx | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- toYaml $pod | nindent 6 }}
{{- end }}
