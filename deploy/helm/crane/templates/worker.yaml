{{- $ctx := dict "root" . "component" "worker" "role" "worker" }}
{{- $pod := include "crane.podspec" $ctx | fromYaml }}
{{- $c := index $pod.containers 0 }}
{{- $_ := set $c "ports" (list (dict "name" "admin" "containerPort" .Values.ports.admin)) }}
{{- $_ := set $c "resources" .Values.worker.resources }}
{{- $_ := set $c "readinessProbe" (dict "httpGet" (dict "path" "/healthz/ready" "port" "admin") "periodSeconds" 5) }}
{{- $_ := set $c "livenessProbe" (dict "httpGet" (dict "path" "/healthz/live" "port" "admin") "periodSeconds" 10) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crane.fullname" . }}-worker
  labels: {{ include "crane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{ include "crane.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{ include "crane.selector" $ctx | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- toYaml $pod | nindent 6 }}
