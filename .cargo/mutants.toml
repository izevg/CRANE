# Полный мутационный гейт запускается локально перед PR в release/* (task gate).
timeout_multiplier = 3.0
# Запас на нагрузку при параллельных сборках (task gate JOBS=N): медленный тест не должен выглядеть как зависание мутанта.
minimum_test_timeout = 45
# Контракт портов — исполняемая спецификация (тестовый код), мутировать её бессмысленно.
exclude_globs = ["**/tests/**", "**/benches/**", "crates/core/ports/src/contract/**"]
# Поведение портов проверяет контракт в крейтах-адаптерах; без этого мутанты ports
# прогоняют только тесты самого ports, где проверять нечего.
test_workspace = true
# Мутанты в коде без логики исключаются здесь, а не убиваются тавтологичными тестами
# (правило AAA/логики, AGENTS.md «Тестирование»).
exclude_re = [
  # Debug — диагностика, не логика: тесты на формат Debug запрещены правилом AAA/логики.
  # У секретов Debug нет вовсе (AGENTS.md: секрет оборачивается в тип без Debug/Display),
  # поэтому Debug с редакцией не появится и исключение не скроет мутант редакции.
  "impl (fmt::)?Debug for",
  # Константный хеш корректен по контракту Hash (равные значения дают равные хеши),
  # мутант `hash -> ()` поведенчески эквивалентен; различимость хешей не обязана.
  "impl Hash for (PackageName|Version)>::hash with \\(\\)",
  # Тестовый двойник: счётчик 0, 1, 2 вместо 1, 2, 3 остаётся уникальным, а нужна
  # только уникальность; отдельный тест на начало отсчёта проверял бы сам двойник.
  "replace \\+ with \\* in <impl IdGen for SequentialIdGen>::generate",
  # Тонкая обёртка над SystemTime::now без логики: проверять нечего, кроме самой платформы.
  "impl Clock for SystemClock",
  # Корень сборки процесса: разбор роли, запуск и инициализация логов проверяет e2e-стенд
  # (`task e2e`: настоящий cargo против сервера в Compose), а не юнит-тесты. Логика фильтра
  # журнала ИБ вынесена в `log_filter` и мутируется как обычно.
  "entry/server/src/main\\.rs:\\d+:\\d+: replace (main|execute|init_logging)\\b",
  # Запуск слушателей и обработка сигналов ОС (SIGTERM, Ctrl+C) — та же проводка процесса:
  # проверяется e2e-стендом (`task e2e` поднимает и гасит сервер в Compose).
  "entry/server/src/run/mod\\.rs:\\d+:\\d+: replace (serve|serve_async|shutdown_signal|terminate)\\b",
  # После сдвига на NIBBLE_BITS младшие 4 бита `hi` нулевые, а `lo` ≤ 15: `|` и `^` дают один
  # результат на любых входах, мутант эквивалентен.
  "digest/hex\\.rs:\\d+:\\d+: replace \\| with \\^ in parse",
  # `ACCEPT_SHA1_ONLY` — константа `false`: ветка с sha1 недостижима, пока владелец не включит её
  # осознанно, а замена охранника на `false` не меняет поведения при текущем значении.
  "replace match guard ACCEPT_SHA1_ONLY with false in tarball",
]
