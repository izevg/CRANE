# Полный мутационный гейт запускается локально перед PR в release/* (task gate).
timeout_multiplier = 3.0
minimum_test_timeout = 20
# Контракт портов — исполняемая спецификация (тестовый код), мутировать её бессмысленно.
exclude_globs = ["**/tests/**", "**/benches/**", "crates/core/ports/src/contract/**"]
# Поведение портов проверяет контракт в крейтах-адаптерах; без этого мутанты ports
# прогоняют только тесты самого ports, где проверять нечего.
test_workspace = true
# Мутанты в коде без логики исключаются здесь, а не убиваются тавтологичными тестами
# (правило AAA/логики, AGENTS.md «Тестирование»).
exclude_re = [
  # Debug — диагностика, не логика: тесты на формат Debug запрещены правилом AAA/логики.
  "impl (fmt::)?Debug for",
  # Константный хеш корректен по контракту Hash (равные значения дают равные хеши),
  # мутант `hash -> ()` поведенчески эквивалентен; различимость хешей не обязана.
  "impl Hash for (PackageName|Version)>::hash with \\(\\)",
  # Тестовый двойник: счётчик 0, 1, 2 вместо 1, 2, 3 остаётся уникальным, а нужна
  # только уникальность; отдельный тест на начало отсчёта проверял бы сам двойник.
  "replace \\+ with \\* in <impl IdGen for SequentialIdGen>::generate",
]
