# Только пермиссивные лицензии (раздел 17). Проверка: cargo deny check.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]

# Корневые сертификаты Mozilla как данные, лицензия пермиссивная. Тянется цепочкой
# object_store[aws] -> reqwest -> rustls-platform-verifier; глобально лицензию не разрешаем.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Те же корни Mozilla для TLS sqlx (tls-rustls-aws-lc-rs в crane-pg). Версия >= 1.0.10
# обязательна: ранние содержат корень emSign из RUSTSEC-2026-0381.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# cargo-deny считает path-зависимость без версии wildcard; крейты workspace не публикуются (`publish = false`), и с этим флагом он их не трогает.
allow-wildcard-paths = true
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
