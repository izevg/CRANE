          format: date-time
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Момент архивации; `null` - команда активна.
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self, crane:overview, crane:members, crane:update-workspace, crane:archive-workspace
            (у активной) | crane:unarchive-workspace (у архивной), crane:usage'
