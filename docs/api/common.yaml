openapi: 3.1.0
info:
  title: CRANE common components
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: 'Общие компоненты контрактов API CRANE: схемы, параметры, ответы, заголовки, схемы безопасности и
    общие path items. Единый источник истины для `admin.openapi.yaml` и `cli.openapi.yaml`; сам по себе не публикуется.'
paths: {}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-crane_session
      description: 'Сессия BFF: cookie `__Host-crane_session` с флагами HttpOnly, Secure, SameSite=Strict, Path=/
        и без Domain. Токены Keycloak хранит BFF на сервере, браузер их не видит. Мутации (POST, PUT, PATCH, DELETE)
        дополнительно требуют заголовок `X-CSRF-Token` со значением `csrf_token` из ответа `GET /api/v1/session`
        и проходят проверку заголовка Origin.'
    bearer:
      type: http
      scheme: bearer
      description: 'JWT Keycloak с `aud: crane` либо токен CRANE: `crp_` (личный или сессионный), `crr_` (робот),
        `crci_` (нагрузка CI). Права в токен не зашиты: каждый запрос заново проходит авторизацию Cedar.'
  headers:
    XRequestId:
      description: Идентификатор запроса (UUIDv7). Есть у каждого ответа; по нему работает `GET /diagnostics/{request_id}`.
      required: true
      schema:
        type: string
    ETag:
      description: Валидатор представления; повторите запрос с `If-None-Match`, получите 304 без тела.
      schema:
        type: string
    CacheControl:
      description: 'Политика кэширования: `private, max-age=<каденс опроса>`.'
      schema:
        type: string
    CacheControlNoStore:
      description: 'Всегда `no-store`: тело содержит секрет или персональные данные.'
      schema:
        type: string
        const: no-store
    Location:
      description: Адрес созданного или поставленного в очередь ресурса.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Через сколько секунд повторить запрос.
      schema:
        type: integer
        minimum: 0
    WWWAuthenticate:
      description: 'Для step-up (RFC 9470): `Bearer error="insufficient_user_authentication", acr_values="mfa"`.'
      schema:
        type: string
  parameters:
    Cursor:
      name: Cursor
      in: query
      description: Непрозрачный курсор страницы из `_links.next.href`. Не разбирайте и не конструируйте.
      schema:
        type: string
    Limit:
      name: Limit
      in: query
      description: Размер страницы (по умолчанию 50, максимум 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Fields:
      name: Fields
      in: query
      description: 'Частичный ответ: имена полей элемента через запятую.'
      schema:
        type: string
      example: purl_base,name,latest
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Ключ идемпотентности. Обязателен для POST (создание и действия). Хранится 24 часа вместе с хэшем запроса; повтор с тем же телом возвращает прежний результат, повтор с другим телом даёт 422 `idempotency-key-reuse`. Ключ действует в пределах principal: чужой ключ не совпадает с вашим. Ответы с секретом (`*Created` токена, credential робота, вебхука) не сохраняются: повтор возвращает 409 `idempotency-replay-secret` со ссылкой на созданный ресурс, без секрета.'
      required: true
      schema:
        type: string
      example: 0192f3a4-7b1c-7e21-9a10-3f5d2c1b8e77
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      description: 'Ключ идемпотентности (необязателен для PUT, PATCH, DELETE). Правила хранения те же: 24 часа,
        хэш запроса, 422 `idempotency-key-reuse`.'
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: ETag изменяемой политики или настройки. Несовпадение даёт 412.
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag из прошлого ответа; при совпадении сервер отвечает 304 без тела.
      schema:
        type: string
    SettingKey:
      name: key
      in: path
      description: Ключ настройки - файловый ключ конфигурации (`blobs`, `public_url`, `cargo_proxy_repos`); переменная окружения - `CRANE_` + верхний регистр.
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]*$'
        maxLength: 96
    OnboardingStep:
      name: step
      in: path
      description: Шаг мастера первого запуска.
      required: true
      schema:
        $ref: '#/components/schemas/OnboardingStepId'
    TokenId:
      name: token_id
      in: path
      description: Идентификатор ресурса (token_id).
      required: true
      schema:
        type: string
    RequestId:
      name: request_id
      in: path
      description: Идентификатор ресурса (request_id).
      required: true
      schema:
        type: string
    Format:
      name: format
      in: path
      description: Формат пакетов (код формата).
      required: true
      schema:
        type: string
        enum:
        - maven
        - npm
        - pypi
        - nuget
        - cargo
      example: npm
    Repository:
      name: repository
      in: path
      description: Имя репозитория.
      required: true
      schema:
        type: string
      example: npm-hosted
    Name:
      name: name
      in: path
      description: 'Имя пакета одним сегментом пути с percent-encoding: `@acme/ui` передаётся как `%40acme%2Fui`.
        Ingress и прокси не должны декодировать `%2F` до маршрутизации. GET по неканоническому имени отвечает 308
        на канонический путь.'
      required: true
      schema:
        type: string
      example: '%40acme%2Fui'
    Version:
      name: version
      in: path
      description: Каноническая форма версии (`version.canonical`).
      required: true
      schema:
        type: string
      example: 1.4.2
    RobotId:
      name: robot_id
      in: path
      description: Идентификатор ресурса (robot_id).
      required: true
      schema:
        type: string
    ExportId:
      name: export_id
      in: path
      description: Идентификатор ресурса (export_id).
      required: true
      schema:
        type: string
    NotificationId:
      name: notification_id
      in: path
      description: Идентификатор ресурса (notification_id).
      required: true
      schema:
        type: string
    Tag:
      name: tag
      in: path
      description: Идентификатор ресурса (tag).
      required: true
      schema:
        type: string
    EvidenceId:
      name: evidence_id
      in: path
      description: Идентификатор ресурса (evidence_id).
      required: true
      schema:
        type: string
    NamespaceId:
      name: namespace_id
      in: path
      description: Идентификатор ресурса (namespace_id).
      required: true
      schema:
        type: string
    PolicyId:
      name: policy_id
      in: path
      description: Идентификатор ресурса (policy_id).
      required: true
      schema:
        type: string
    Workspace:
      name: workspace
      in: path
      description: 'Slug команды (workspace), не переиспользуется.'
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]{1,62}$
    CheckId:
      name: check_id
      in: path
      description: Идентификатор ресурса (check_id).
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      description: Идентификатор ресурса (job_id).
      required: true
      schema:
        type: string
    MoveId:
      name: move_id
      in: path
      description: Идентификатор ресурса (move_id).
      required: true
      schema:
        type: string
    ImportId:
      name: import_id
      in: path
      description: Идентификатор ресурса (import_id).
      required: true
      schema:
        type: string
    WebhookId:
      name: webhook_id
      in: path
      description: Идентификатор ресурса (webhook_id).
      required: true
      schema:
        type: string
    DeliveryId:
      name: delivery_id
      in: path
      description: Идентификатор ресурса (delivery_id).
      required: true
      schema:
        type: string
    BlockId:
      name: block_id
      in: path
      description: Идентификатор ресурса (block_id).
      required: true
      schema:
        type: string
    ReviewId:
      name: review_id
      in: path
      description: Идентификатор ресурса (review_id).
      required: true
      schema:
        type: string
    FindingId:
      name: finding_id
      in: path
      description: Идентификатор ресурса (finding_id).
      required: true
      schema:
        type: string
    EventId:
      name: event_id
      in: path
      description: Идентификатор ресурса (event_id).
      required: true
      schema:
        type: string
    AdvisoryId:
      name: advisory_id
      in: path
      description: Идентификатор ресурса (advisory_id).
      required: true
      schema:
        type: string
    PrincipalId:
      name: principal_id
      in: path
      description: Идентификатор участника (principal_id).
      required: true
      schema:
        type: string
        format: uuid
    Role:
      name: role
      in: path
      description: Роль в команде.
      required: true
      schema:
        $ref: '#/components/schemas/WorkspaceRoleName'
    MappingId:
      name: mapping_id
      in: path
      description: Идентификатор маппинга группы (mapping_id).
      required: true
      schema:
        type: string
    AccessGrantId:
      name: grant_id
      in: path
      description: Идентификатор межкомандного гранта (grant_id).
      required: true
      schema:
        type: string
        format: uuid
    GrantId:
      name: grant_id
      in: path
      description: Идентификатор ресурса (grant_id).
      required: true
      schema:
        type: string
    ExceptionId:
      name: exception_id
      in: path
      description: Идентификатор ресурса (exception_id).
      required: true
      schema:
        type: string
    SinkId:
      name: sink_id
      in: path
      description: Идентификатор ресурса (sink_id).
      required: true
      schema:
        type: string
    ConfirmationId:
      name: confirmation_id
      in: path
      description: Идентификатор ресурса (confirmation_id).
      required: true
      schema:
        type: string
    SettingIfMatch:
      name: If-Match
      in: header
      description: 'Обновление существующей строки: `"<version>"` из `ETag` или `Setting.version`. Без `If-Match` и без `If-None-Match: *` - 428 `precondition-required`; устаревшая версия - 412.'
      schema:
        type: string
    SettingIfNoneMatch:
      name: If-None-Match
      in: header
      description: 'Создание: `*` - строки быть не должно (иначе 412). Без него и без `If-Match` - 428 `precondition-required`.'
      schema:
        type: string
        enum:
        - '*'
    SettingGroup:
      name: group
      in: path
      description: Группа (секция) настроек.
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]*$'
        maxLength: 96
  responses:
    BadRequest:
      description: 'Некорректный запрос: синтаксис или параметры.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 'Не аутентифицирован: нет или недействителен credential. Для сессии см. `reason`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Ресурс виден вызывающему, но действие ему запрещено. Тело содержит `rule_id`, `request_id`, `remediation`,
        `contact`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 'Не найдено или нет доступа. Скрытый и несуществующий ресурс неразличимы: тело и заголовки идентичны
        (`type` `…/problems/not-found`, нейтральный title и detail, без `rule_id`, `remediation`, `contact`, `reasons`),
        время ответа не зависит от существования ресурса.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Конфликт состояния; при отказе политики `reasons` объясняют причину по видимому ресурсу.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: 'Ресурс существовал, но больше недоступен (например, истёк план подтверждения: `plan-expired`).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: '`If-Match` не совпал с текущим ETag: перечитайте ресурс.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Запрос понятен, но нарушает правило (валидация домена, `idempotency-key-reuse`, `format-has-no-yank`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SettingInvalid:
      description: '`setting-invalid`: значение не проходит разбор секции; `errors` перечисляет ключи и причины. Другие 422: `secrets-unavailable`, `idempotency-key-reuse`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SettingInvalidProblem'
    TooManyRequests:
      description: Превышен лимит запросов (GCRA).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутренняя ошибка; укажите `request_id` при обращении.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 'Сервис недоступен: режим read-only, деградация зависимости, ИИ-контур недоступен (`…/ai-unavailable`).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StepUpRequired:
      description: Нужен повторный вход с MFA (RFC 9470). Тело содержит `required_acr`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: Не изменилось (ETag совпал).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        ETag:
          $ref: '#/components/headers/ETag'
    PreconditionRequired:
      description: '`precondition-required`: запись без `If-Match` (обновление) и без `If-None-Match: *` (создание).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InsecurePublicUrl:
      description: '`insecure-public-url`: `CRANE_PUBLIC_URL` указывает на http не с loopback, мастер закрыт. `detail`: задайте https либо `CRANE_REQUIRE_SECURE_CONFIG=false`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ProblemReason:
      title: ProblemReason
      type: object
      description: Причина отказа по видимому ресурсу (например, gate продвижения).
      properties:
        code:
          type: string
        text:
          type: string
        ref:
          type: string
      required:
      - code
      - text
    ProblemContact:
      title: ProblemContact
      type: object
      properties:
        display:
          type: string
        role:
          type: string
      required:
      - display
      - role
    Problem:
      title: Problem
      type: object
      description: 'Тело ошибки по RFC 9457 (`application/problem+json`). `decision_trace` в теле ошибки нет намеренно:
        отказ не раскрывает существование ресурса. Авторизация Cedar считается на уровне репозитория или workspace
        до поиска ресурса. Скрытый и несуществующий ресурс дают одинаковый 404 (`…/problems/not-found`, нейтральный
        текст «Не найдено или нет доступа», без `rule_id`, `remediation`, `contact`, `reasons`; время ответа не
        различается). 403 возвращается только для ресурса, который вызывающий видит, но действие над которым ему
        запрещено; тогда есть `rule_id`, `request_id`, `remediation`, `contact`. Трассу решения показывает только
        `GET /diagnostics/{request_id}` и только тому, кто сделал запрос. Для 401 сессии `reason` принимает значения
        `session_expired`, `session_revoked`, `session_elsewhere`.'
      properties:
        type:
          type: string
          format: uri
          description: URI вида `https://crane.example/problems/<slug>`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        reason:
          type: string
          description: Стабильный машинный код (например, `reserved_internal_name`, `session_expired`, `session_revoked`,
            `session_elsewhere`).
        rule_id:
          type: string
        request_id:
          type: string
        remediation:
          type: array
          items:
            type: string
        contact:
          $ref: '#/components/schemas/ProblemContact'
        required_acr:
          type: string
          description: Требуемый уровень аутентификации (step-up), например `mfa`.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/ProblemReason'
      required:
      - type
      - title
      - status
      - request_id
    HalLink:
      title: HalLink
      type: object
      description: Ссылка HAL (draft-kelly-json-hal).
      properties:
        href:
          type: string
          description: URI или шаблон URI (RFC 6570), относителен /api/v1 либо абсолютен.
        templated:
          type: boolean
        title:
          type: string
        name:
          type: string
      required:
      - href
    HalCurie:
      title: HalCurie
      type: object
      description: 'Сокращение имени отношения: `crane:<rel>` разворачивается шаблоном `href`.'
      properties:
        name:
          type: string
        href:
          type: string
        templated:
          type: boolean
      required:
      - name
      - href
      - templated
    HalLinks:
      title: HalLinks
      type: object
      description: Ссылки HAL. Обязателен `self`; на корне ответа есть `curies`. Ссылка-действие присутствует, только
        если Cedar разрешает вызывающему и состояние ресурса допускает действие; отсутствие ссылки означает, что
        кнопки нет.
      properties:
        self:
          $ref: '#/components/schemas/HalLink'
        curies:
          type: array
          items:
            $ref: '#/components/schemas/HalCurie'
      required:
      - self
      additionalProperties:
        oneOf:
        - $ref: '#/components/schemas/HalLink'
        - type: array
          items:
            $ref: '#/components/schemas/HalLink'
    Format:
      title: Format
      type: string
      enum:
      - maven
      - npm
      - pypi
      - nuget
      - cargo
      description: Формат пакетов.
    RepositoryKind:
      title: RepositoryKind
      type: string
      enum:
      - hosted
      - proxy
      description: Тип репозитория.
    VersionState:
      title: VersionState
      type: string
      enum:
      - quarantined
      - released
      - blocked
      - deleted
      description: 'Действующее состояние версии - вердикт видимости `served()` (10.2): решения о самой версии и действующие правила (экстренные блокировки, окно карантина). Есть и у proxy-версии без строки в каталоге.'
    LifecycleState:
      title: LifecycleState
      type: string
      enum:
      - active
      - deprecated
      - eol
      description: Жизненный цикл пакета.
    PrincipalKind:
      title: PrincipalKind
      type: string
      enum:
      - human
      - robot
      - workload
      - agent
      description: Тип участника.
