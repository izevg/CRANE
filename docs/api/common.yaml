          required:
          - crane:dependencies
      required:
      - _links
      - _embedded
    VersionFindingList:
      title: VersionFindingList
      type: object
      description: Находки версии.
      properties:
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self'
        _embedded:
          type: object
          properties:
            crane:findings:
              type: array
              items:
                $ref: '#/components/schemas/FindingRow'
          required:
          - crane:findings
        scan:
          oneOf:
          - $ref: '#/components/schemas/ScanInfo'
          - type: 'null'
      required:
      - _links
      - _embedded
      - scan
    QuarantineList:
      title: QuarantineList
      type: object
      description: Версии в quarantine.
      properties:
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self'
        _embedded:
          type: object
          properties:
            crane:versions:
              type: array
              items:
                $ref: '#/components/schemas/VersionSummary'
          required:
          - crane:versions
      required:
      - _links
      - _embedded

    RoleBinding:
      title: RoleBinding
      type: object
      description: Строка роли `role_binding`. Принципал с несколькими ролями или источниками даёт несколько строк;
        эффективная роль - максимум. В `GET …/members` приходят только открытые строки (`valid_to` = `null`), в
        `GET …/members/history` - любые.
      properties:
        principal:
          $ref: '#/components/schemas/PrincipalRef'
        role:
          $ref: '#/components/schemas/WorkspaceRoleName'
        source:
          $ref: '#/components/schemas/BindingSource'
        valid_from:
          type: string
          format: date-time
          description: Момент, когда CRANE УВИДЕЛ факт, а не время изменения в IdP.
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
          description: '`null` - строка открыта.'
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL (только в `GET …/members`): self, crane:remove-member (у строки с источником `local`,
            если вызывающий owner команды)'
      required:
      - principal
      - role
      - source
      - valid_from
      - valid_to
    RoleBindingPage:
      title: RoleBindingPage
      type: object
      description: Строки ролей команды, курсорная пагинация (текущий состав или история за окно `from`..`to`).
      properties:
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self, next, prev; в `GET …/members` ещё crane:add-member (шаблон `{principal_id}`, `{role}`; только owner
            команды и `access.local_membership=allow`) и crane:members-history (owner, secops, auditor)'
        _embedded:
          type: object
          properties:
            crane:role-bindings:
              type: array
              items:
                $ref: '#/components/schemas/RoleBinding'
          required:
          - crane:role-bindings
      required:
      - _links
      - _embedded
    InstanceRoleName:
      title: InstanceRoleName
      type: string
      enum:
      - appsec
      - secops
      - auditor
      - platform-admin
      description: Роль экземпляра (не привязана к команде).
    GroupMappingRole:
      title: GroupMappingRole
      type: string
      enum:
      - reader
      - developer
      - maintainer
      - owner
      - appsec
      - secops
      - auditor
      - platform-admin
      description: 'Роль маппинга: роль команды (`reader`, `developer`, `maintainer`, `owner`) или роль экземпляра
        (`appsec`, `secops`, `auditor`, `platform-admin`). Ограничение CHECK: `workspace` равен `null` тогда и
        только тогда, когда роль - роль экземпляра.'
    GroupMapping:
      title: GroupMapping
      type: object
      description: Единственный путь прав из IdP. Нормализованная группа (`group_ref`) отображается в роль команды
        или в роль экземпляра. Команды создаются в CRANE, группа IdP команду не создаёт.
      properties:
        id:
          type: string
        group_ref:
          type: string
          description: 'Нормализованная группа: путь, имя, id или `role:<имя>`.'
        workspace:
          type:
          - string
          - 'null'
          description: Slug команды; `null` - роль экземпляра.
        role:
          $ref: '#/components/schemas/GroupMappingRole'
        created_by:
          $ref: '#/components/schemas/PrincipalRef'
        created_at:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self, crane:delete-group-mapping'
      required:
      - id
      - group_ref
      - workspace
      - role
      - created_by
      - created_at
      - _links
    GroupMappingPage:
      title: GroupMappingPage
      type: object
      description: Страница ресурса GroupMapping.
      properties:
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self, crane:create-group-mapping'
        _embedded:
          type: object
          properties:
            crane:group-mappings:
              type: array
              items:
                $ref: '#/components/schemas/GroupMapping'
          required:
          - crane:group-mappings
      required:
      - _links
      - _embedded
    GroupMappingCreate:
      title: GroupMappingCreate
      type: object
      description: 'Создание маппинга. Ограничение CHECK: `workspace` равен `null` тогда и только тогда, когда `role` -
        роль экземпляра (`appsec`, `secops`, `auditor`, `platform-admin`); нарушение даёт 422. Повтор тройки
        (`group_ref`, `workspace`, `role`) даёт 409.'
      properties:
        group_ref:
          type: string
          minLength: 1
        workspace:
          type:
          - string
          - 'null'
          description: Slug команды; `null` - роль экземпляра.
        role:
          $ref: '#/components/schemas/GroupMappingRole'
      required:
      - group_ref
      - workspace
      - role
    AccessGrantRole:
      title: AccessGrantRole
      type: string
      enum:
      - reader
      - developer
      - maintainer
      description: Роль, которую грант даёт команде-получателю (`owner` не выдаётся).
    AccessGrantResource:
      title: AccessGrantResource
      description: Ресурс гранта - ровно один из двух вариантов (`num_nonnulls(namespace_id, repository_id) = 1`).
      oneOf:
      - type: object
        title: AccessGrantNamespace
        properties:
          namespace_id:
            type: string
        required:
        - namespace_id
        additionalProperties: false
      - type: object
        title: AccessGrantRepository
        properties:
          repository:
            type: object
            description: Репозиторий по формату и имени.
            properties:
              format:
                $ref: '#/components/schemas/Format'
              name:
                type: string
            required:
            - format
            - name
        required:
        - repository
        additionalProperties: false
    AccessGrant:
      title: AccessGrant
      type: object
      description: Межкомандный доступ - команда-владелец ресурса даёт другой команде роль на свой namespace или
        репозиторий, с необязательным сроком. Грант получают члены команды-получателя с ролью не ниже роли гранта (иерархия
        reader < developer < maintainer < owner), то есть грант `maintainer` получают maintainer и owner, а `reader` - все члены. По умолчанию
        приватные репозитории чужих команд не видны (404).
      properties:
        id:
          type: string
          format: uuid
        grantee_workspace:
          type: string
          description: Slug команды-получателя.
        owner_workspace:
          type: string
          description: Slug команды-владельца ресурса.
        role:
          $ref: '#/components/schemas/AccessGrantRole'
        resource:
          $ref: '#/components/schemas/AccessGrantResource'
        granted_by:
          $ref: '#/components/schemas/PrincipalRef'
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self, crane:revoke-access-grant (у действующего гранта)'
      required:
      - id
      - grantee_workspace
      - owner_workspace
      - role
      - resource
      - granted_by
      - created_at
      - expires_at
      - revoked_at
      - _links
    AccessGrantPage:
      title: AccessGrantPage
      type: object
      description: Страница ресурса AccessGrant.
      properties:
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self, crane:create-access-grant'
        _embedded:
          type: object
          properties:
            crane:access-grants:
              type: array
              items:
                $ref: '#/components/schemas/AccessGrant'
          required:
          - crane:access-grants
      required:
      - _links
      - _embedded
    AccessGrantCreate:
      title: AccessGrantCreate
      type: object
      properties:
        grantee_workspace:
          type: string
          description: Slug команды-получателя.
        role:
          $ref: '#/components/schemas/AccessGrantRole'
        resource:
          $ref: '#/components/schemas/AccessGrantResource'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Срок гранта; `null` - бессрочно.
      required:
      - grantee_workspace
      - role
      - resource
      - expires_at
    PackageKey:
      title: PackageKey
      type: object
      description: Пакет без namespace (в пакета внутри namespace владелец - владелец namespace, отдельно не передаётся).
      properties:
        format:
          $ref: '#/components/schemas/Format'
        repository:
          type: string
        name:
          type: string
          description: Каноническое имя пакета.
      required:
      - format
      - repository
      - name
    OwnershipResource:
      title: OwnershipResource
      description: Передаваемый ресурс - ровно один из трёх вариантов.
      oneOf:
      - type: object
        title: OwnershipNamespace
        properties:
          namespace_id:
            type: string
        required:
        - namespace_id
        additionalProperties: false
      - type: object
        title: OwnershipPackage
        properties:
          package:
            $ref: '#/components/schemas/PackageKey'
        required:
        - package
        additionalProperties: false
      - type: object
        title: OwnershipRepository
        properties:
          repository:
            type: object
            description: Репозиторий по формату и имени.
            properties:
              format:
                $ref: '#/components/schemas/Format'
              name:
                type: string
            required:
            - format
            - name
        required:
        - repository
        additionalProperties: false
    OwnershipTransferCreate:
      title: OwnershipTransferCreate
      type: object
      description: Передача владения применяется сразу. Роботы и trust policies не передаются.
      properties:
        resource:
          $ref: '#/components/schemas/OwnershipResource'
        to_workspace:
          type: string
          description: Slug команды-получателя.
        justification:
          $ref: '#/components/schemas/Justification'
      required:
      - resource
      - to_workspace
      - justification
    OwnershipTransfer:
      title: OwnershipTransfer
      type: object
      description: Результат передачи владения. Отдельного ресурса нет (история - события журнала `ownership.transferred`
        и `package.claimed`); `self` ведёт на переданный ресурс.
      properties:
        resource:
          $ref: '#/components/schemas/OwnershipResource'
        from_workspace:
          type: string
        to_workspace:
          type: string
        transferred_at:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self'
      required:
      - resource
      - from_workspace
      - to_workspace
      - transferred_at
      - _links
    DownloadEvent:
      title: DownloadEvent
      type: object
      description: Скачивание файла. Метаданные (packument, индекс) событий не дают. `bytes` - сколько байт
        авторизовано к отдаче (для Range - длина диапазона); факт завершения передачи CRANE не знает. Значение без
        собственного адреса.
      properties:
        ts:
          type: string
          format: date-time
        repository:
          $ref: '#/components/schemas/RepositoryRef'
        purl:
          type: string
          description: Package URL версии.
        blob_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        actor:
          $ref: '#/components/schemas/PrincipalRef'
        credential_prefix:
          type: string
          description: Префикс токена.
        workspace:
          type:
          - string
          - 'null'
          description: Команда из атрибуции credential (slug); `null` - не распределено.
        client_ip:
          type: string
        bytes:
          type: integer
          format: int64
          minimum: 0
        source:
          $ref: '#/components/schemas/DownloadSource'
        request_id:
          type: string
      required:
      - ts
      - repository
      - purl
      - blob_sha256
      - actor
      - credential_prefix
      - workspace
      - client_ip
      - bytes
      - source
      - request_id
    DownloadCoverage:
      title: DownloadCoverage
      type: object
      description: Полнота диапазона, читается из событий `audit.download_digest` (24 в сутки). Строки несброшенного
        буфера упавшей реплики не считает никто, поэтому признака `complete` нет.
      properties:
        dropped_known:
          type: integer
          format: int64
          minimum: 0
          description: Сколько строк известно как отброшенных в диапазоне (режим `drop`).
        hours_without_digest:
          type: array
          items:
            type: string
            format: date-time
          description: Часы диапазона (начала часов, UTC), для которых нет дайджеста.
      required:
      - dropped_known
      - hours_without_digest
    DownloadEventPage:
      title: DownloadEventPage
      type: object
      description: Сырой след скачиваний за окно. Каждый вызов пишет `audit.viewed`.
      properties:
        coverage:
          $ref: '#/components/schemas/DownloadCoverage'
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self, next, prev, crane:create-audit-export'
        _embedded:
          type: object
          properties:
            crane:downloads:
              type: array
              items:
                $ref: '#/components/schemas/DownloadEvent'
          required:
          - crane:downloads
      required:
      - coverage
      - _links
      - _embedded
    UsageGroupBy:
      title: UsageGroupBy
      type: string
      enum:
      - day
      - workspace
      - repository
      - package
      - version
      - source
      - principal_kind
      description: Измерение группировки суточного агрегата.
    UsageRow:
      title: UsageRow
      type: object
      description: Строка агрегата. Присутствуют только поля, перечисленные в `group_by`; меры аддитивны. Значение
        без собственного адреса.
      properties:
        day:
          type: string
          format: date
        workspace:
          type:
          - string
          - 'null'
          description: Slug команды; `null` - не распределено.
        repository:
          type: string
        purl:
          type: string
          description: Package URL (для `package` - без версии, для `version` - с версией).
        source:
          $ref: '#/components/schemas/DownloadSource'
        principal_kind:
          $ref: '#/components/schemas/PrincipalKind'
        downloads:
          type: integer
          format: int64
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
      required:
      - downloads
      - bytes
    UsagePage:
      title: UsagePage
      type: object
      description: Суточный агрегат скачиваний. Личностей, токенов и IP нет.
      properties:
        _links:
          $ref: '#/components/schemas/HalLinks'
          description: 'Ссылки HAL: self, next, prev, crane:downloads (сырой след, если разрешён)'
        _embedded:
          type: object
          properties:
            crane:usage:
              type: array
              items:
                $ref: '#/components/schemas/UsageRow'
          required:
          - crane:usage
      required:
      - _links
      - _embedded
    SettingOrigin:
      title: SettingOrigin
      type: string
      description: 'Какой слой дал итоговое значение: `env` (inherited: окружение или файл конфигурации), `stored` (effective: БД), `default` (умолчание).'
      enum:
      - env
      - stored
      - default
    SettingKind:
      title: SettingKind
      type: string
      description: |-
        Вид настройки - подсказка виджета, не тип хранения. Значение всегда строка в форме окружения:
        `list` - элементы через запятую без пробелов (элементы запятых не содержат); `bool` - `true` или `false`; `number` - десятичное целое; `text`, `url` - как есть; у `secret` значение в ответах не возвращается никогда.
      enum:
      - text
      - number
      - bool
      - list
      - url
      - secret
    SettingUnit:
      title: SettingUnit
      type: string
      description: Единица значения вида `number`.
      enum:
      - bytes
      - seconds
    SettingShadowed:
      title: SettingShadowed
      type: object
      description: Значение в БД, которое не действует, потому что ключ задан окружением.
      properties:
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
      required:
      - version
      - updated_at
      - updated_by
    Setting:
      title: Setting
      type: object
      description: 'Итоговое значение настройки и его источник. Секрет не возвращается никогда: только `secret_state`.'
      properties:
        key:
          type: string
        env_var:
          type: string
          description: Имя переменной окружения ключа (подсказка оператору, что менять).
        group:
          type: string
          description: Секция конфигурации, она же группа экрана и шаг мастера (`network`, `storage`, `proxy`, `repos`, `namespaces`, `token`, ...).
        kind:
          $ref: '#/components/schemas/SettingKind'
        unit:
          oneOf:
          - $ref: '#/components/schemas/SettingUnit'
          - type: 'null'
        origin:
          $ref: '#/components/schemas/SettingOrigin'
        locked:
          type: boolean
          description: '`true`, если значение пришло из окружения (`origin=env`) или ключ только для окружения: изменить его из консоли нельзя.'
        value:
          type:
          - string
          - 'null'
          description: Строка в форме окружения (см. `SettingKind`); `null` у секретов и у незаданных ключей.
        secret_state:
          type:
          - string
          - 'null'
          enum:
          - set
          - unset
          - unreadable
          - null
          description: |-
            Только для `kind=secret`. `unreadable` - секрет лежит в БД, но не открывается; причина в поле `unreadable`. Перезаписать (`PUT` с `If-Match`) или удалить (`DELETE`) такую строку можно, ключ шифрования для этого не нужен.
        unreadable:
          oneOf:
          - $ref: '#/components/schemas/SettingUnreadable'
          - type: 'null'
          description: Есть только при `secret_state=unreadable`.
        version:
          type:
          - integer
          - 'null'
          format: int64
          description: Версия строки в БД (ETag для `If-Match`); `null`, если строки нет.
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_by:
          type:
          - string
          - 'null'
        shadowed:
          oneOf:
          - $ref: '#/components/schemas/SettingShadowed'
          - type: 'null'
        _links:
          $ref: '#/components/schemas/HalLinks'
      required:
      - key
      - env_var
      - group
      - kind
      - origin
      - locked
      - _links
    SettingList:
      title: SettingList
      type: object
      properties:
        _embedded:
          type: object
          properties:
            crane:settings:
              type: array
              items:
                $ref: '#/components/schemas/Setting'
          required:
          - crane:settings
        restart_required:
          type: boolean
          description: Снимок настроек в БД отличается от того, с которым процесс стартовал; изменения вступят в силу после перезапуска.
        persistent:
          type: boolean
          description: '`false` в режиме `CRANE_DATABASE_URL=memory`: записать настройки некуда, `PUT` и `DELETE` отвечают 409 `settings-not-persistent`.'
        _links:
          $ref: '#/components/schemas/HalLinks'
      required:
      - _embedded
      - restart_required
      - persistent
      - _links
    SettingWrite:
      title: SettingWrite
      type: object
      properties:
        value:
          type: string
          description: Новое значение в форме окружения (см. `SettingKind`). Для секрета без `CRANE_SETTINGS_KEY_FILE` - 422 `secrets-unavailable`.
      required:
      - value
    SettingError:
      title: SettingError
      type: object
      properties:
        key:
          type: string
        detail:
          type: string
          description: Причина из разбора секции, без значения секрета.
      required:
      - key
      - detail
    SettingInvalidProblem:
      title: SettingInvalidProblem
      description: 'Problem `422 setting-invalid` с расширением `errors`: на `PUT /settings/{key}` один элемент, на шаге мастера - по ключам шага.'
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          errors:
            type: array
            items:
              $ref: '#/components/schemas/SettingError'
        required:
        - errors
    OnboardingState:
      title: OnboardingState
      type: string
      enum:
      - pending
      - completed
    OnboardingStepId:
      title: OnboardingStepId
      type: string
      description: Шаги мастера (раздел 20.4).
      enum:
      - environment
      - storage
      - upstream
      - namespaces
      - workspaces
      - identity
      - remaining
      - summary
    OnboardingStepStatus:
      title: OnboardingStepStatus
      type: string
      description: 'Вычисляется, не хранится: `done` - разбор секции шага проходит, `done_by_env` - к тому же все ключи шага из окружения, `unavailable` - возможность ещё не включена (команды и OIDC до v0.4.0), иначе `todo`.'
      enum:
      - todo
      - done
      - done_by_env
      - unavailable
    OnboardingStep:
      title: OnboardingStep
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OnboardingStepId'
        status:
