    SettingUnreadable:
      title: SettingUnreadable
      type: object
      description: |-
        Почему секрет в БД не открывается, и что делать оператору. Значения в ответе нет ни при каком `reason`.

        - `missing_key`: секрет есть, а ключа шифрования нет. Задайте `CRANE_SETTINGS_KEY_FILE` прежним ключом либо перезапишите значение.
        - `wrong_key`: ключ сменился. Верните ключ с отпечатком `stored_key_id` либо перезапишите значение; `current_key_id` - отпечаток действующего ключа.
        - `corrupted`: шифртекст повреждён или принадлежит другой строке. Перезапишите значение.
      properties:
        reason:
          type: string
          enum:
          - missing_key
          - wrong_key
          - corrupted
        stored_key_id:
          type: string
          description: Отпечаток ключа, которым секрет зашифрован. Только при `wrong_key`.
        current_key_id:
          type: string
          description: Отпечаток действующего ключа. Только при `wrong_key`.
      required:
      - reason
    SettingGroupWrite:
      title: SettingGroupWrite
      type: object
      description: Атомарная запись ключей одной группы; один отказ - ничего не записано.
      properties:
        values:
