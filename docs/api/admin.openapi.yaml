openapi: 3.1.0
info:
  title: CRANE Admin API (SPA и BFF)
  version: 0.1.0
  summary: Целевая спека (design-first).
  description: |
    Контракт API для SPA и BFF CRANE. Префикс `/api/v1`, аутентификация cookie-сессией `__Host-crane_session`, мутации с `X-CSRF-Token` и проверкой Origin.

    ## Статус документа

    Целевая спека (design-first): контракт написан до кода. Раздел 13 говорит, что спека генерируется из кода (utoipa); контракт-тест сверит вывод utoipa с этим документом. Какой из источников главный в итоге, решает продукт.

    ## Фазы и версии

    Каждая операция несёт `x-crane-phase` и `x-crane-since`: P0 = v0.4.0 (доступ, базовый UI, CLI; часть в v0.5.0), P1 = v0.6.0, P2 = v1.1.0, P3 = v1.2.0.

    ## Расширения операции

    | Расширение | Смысл |
    | --- | --- |
    | `x-crane-phase`, `x-crane-since` | Фаза и версия поставки |
    | `x-crane-action` | Действие Cedar `<контекст>:<глагол>` (для журнала `audit:read`, `audit:reveal_pii`, `audit:export`, как в 14.12) |
    | `x-crane-step-up` | Требует свежего MFA (step-up, раздел 13); без него 401 с `WWW-Authenticate` по RFC 9470 |
    | `x-crane-step-up-when` | Условие, при котором операции с `x-crane-step-up: false` всё же нужен step-up (например, `kind = personal`) |
    | `x-crane-audit` | `{event, ocsf_class}` или `null` для чтений без аудита (классы 14.9: 3002, 3001, 6003, 2002, 2003, 2004) |
    | `x-crane-open-question` | Неясность продукта, решение за владельцем |

    Флаги `x-crane-step-up` совпадают со списком опасных действий раздела 14.12; расхождение ловит контракт-тест.

    ## Адресация

    Пакет: `/packages/{format}/{repository}/{name}`. `name` - один сегмент с percent-encoding (`@acme/ui` -> `%40acme%2Fui`), ingress не должен декодировать `%2F`. Версия - каноническая форма: `/versions/{version}`. Внутренний bigint id наружу не выдаётся. GET по неканоническому имени отвечает 308 на канонический путь. В ответах: `name{display, normalized}`, `version{canonical, display}`, `purl` (версии) или `purl_base` (пакет), `repository{name, format, kind, workspace}`.

    ## Списки

    Курсор: `cursor` (непрозрачная строка) и `limit` (по умолчанию 50, максимум 200). Следующая страница - `_links.next.href`, `prev` аналогично; offset, page и total на горячих списках нет. Счётчики - только отдельные агрегаты: `stats.versions_by_state`, `GET /findings/summary`, `GET /license-reviews/summary`, фасеты поиска `{value, count, capped}` (потолок 1000), `GET /audit/summary`. Сортировка: `sort=-published_at` (минус - по убыванию, ключи через запятую). Множества фильтров - повторяемые параметры (`priority=P0&priority=P1`). `fields` - частичный ответ (поиск, версии, находки, журнал). Время - RFC 3339 UTC с миллисекундами; числа сырые (байты, мс, доли 0..1); enum - машинные коды; человеческий текст только в `problem.detail` и `remediation`. Деградации явные: `stale{since, reason, served_until}`; плитка без данных - `null`, не 0.

    ## Ошибки

    Ошибки - `application/problem+json` (RFC 9457), схема `Problem`. Скрытый и несуществующий ресурс дают одинаковый 404 (`…/problems/not-found`, «Не найдено или нет доступа», без `rule_id`, `remediation`, `contact`, `reasons`; время ответа не различается, потому что авторизация Cedar на уровне репозитория или workspace выполняется до поиска). 403 - только для ресурса, который вызывающий видит, но действие ему запрещено. Трасса решения - только `GET /diagnostics/{request_id}`. 401 с MFA: `StepUpRequired` и `WWW-Authenticate: Bearer error="insufficient_user_authentication", acr_values="mfa"`. 410 - истёкший план (`plan-expired`); 503 - read-only, деградация, ИИ недоступен (`…/ai-unavailable`). То же правило действует в протоколах форматов (`/cargo`, `/npm`, `/pypi`, `/maven`, `/nuget`): скрытый пакет отвечает как несуществующий, причина - только в `GET /diagnostics/{request_id}` (13).

    ## Заголовки и условные запросы

    Каждый ответ несёт `X-Request-Id`. Мутации принимают `Idempotency-Key` (обязателен для POST; хранится 24 часа вместе с хэшем запроса; повтор с другим телом - 422 `idempotency-key-reuse`). Кэшируемые GET отдают `ETag` и принимают `If-None-Match` (304). Изменение политик и настроек требует `If-Match` (412). Ключ идемпотентности действует в пределах principal; ответы с секретом не сохраняются, повтор даёт 409 `idempotency-replay-secret` без секрета.

    ## Права строк

    Права строк коллекции считаются полностью (роль, область и состояние), а не только по состоянию: кэш решений Cedar ключуется по (principal, epoch, action, scope_key) уровня репозитория или workspace (раздел 10.4); на странице до 200 строк это единицы различных ключей, стоимость пренебрежима. Ссылки-действия строки лежат в `_links` элемента.

    ## Секреты и персональные данные

    Секрет возвращают только 201 выпуска токена, credential робота и вебхука (схемы `*Created`, `Cache-Control: no-store`). Везде иначе - только `prefix` (префикс и 8 символов). Ключи интеграций - `{is_set, updated_at}`. Журнал всегда маскирован (`actor.pseudonym`, `src_ip_masked` /24); полные данные - только `POST /audit/events/{event_id}/reveal`. ФИО из Keycloak вне журнала допустимы. Тексты промптов LLM, заголовки Authorization и байты пакетов через /api не отдаются.

    ## Байты пакетов и сырое содержимое

    Ответы с недоверенным содержимым (`/packages/{format}/{repository}/{name}/versions/{version}/metadata`, `/packages/{format}/{repository}/{name}/versions/{version}/evidence/{evidence_id}/content`, README `/packages/{format}/{repository}/{name}/readme`, файлы пакетов в протоколах) всегда несут `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox; default-src 'none'` и, кроме JSON-документов протоколов, `Content-Disposition: attachment`. Протоколы форматов отдаются с отдельного origin пакетов (`CRANE_PACKAGES_URL`, 16.1), если он задан. Консоль (SPA и `/api`) отдаётся со строгой CSP (раздел 15).

    ## Представление: JSON-HAL

    Ресурсы и коллекции - `application/hal+json`; ошибки - `application/problem+json`. Каждый ресурс имеет `_links` с обязательным `self`, на корне ответа - `_links.curies` (`crane` -> `https://crane.example/docs/rels/{rel}`). Коллекции кладут элементы в `_embedded.<rel>`. Доступность действия определяется наличием ссылки-действия в `_links` (сервер кладёт её, только если Cedar разрешает и состояние допускает); нет ссылки - нет кнопки. `denied_actions[{action, rule_id, reason}]` - обычное свойство только для отношений `crane:issue-token`, `crane:promote`, `crane:request-approval`, `crane:delete`; `action` - ActionRel (ключ ссылки-действия в `_links`). Протокольные ответы не HAL: raw metadata версии, README (`text/markdown`).

    ### Отношения ссылок

    Правило: все `crane:*` отношения, которых нет в таблице ниже, - навигация: метод GET, цель - сама ссылка. Отношения-действия перечислены в таблице (один rel - ровно одна операция, она же указана в `x-crane-rel`); метод, путь и тело клиент берёт только из неё. Каждая мутация достижима ссылкой: создание - ссылка `crane:create-…` на коллекции, изменение и переход состояния - ссылка на элементе. Без ссылок: `/tokens/exchange`, `/session/*` (302-потоки), `/response/*` (SOAR-робот).

    | Отношение-действие | Метод | Цель | Тело |
    | --- | --- | --- | --- |
    | `crane:issue-token` | POST | `/tokens` | `TokenCreate` |
    | `crane:revoke` | POST | `/tokens/{token_id}/revoke` | `RevokeBody` |
    | `crane:create-robot` | POST | `/robots` | `RobotCreate` |
    | `crane:credentials` | POST | `/robots/{robot_id}/credentials` | нет |
    | `crane:disable` | POST | `/robots/{robot_id}/disable` | нет |
    | `crane:create-namespace` | POST | `/namespaces` | `NamespaceCreate` |
    | `crane:delete-namespace` | DELETE | `/namespaces/{namespace_id}` | нет |
    | `crane:create-trust-policy` | POST | `/trust-policies` | `TrustPolicyCreate` |
    | `crane:update-trust-policy` | PATCH | `/trust-policies/{policy_id}` | `TrustPolicyPatch` |
    | `crane:delete-trust-policy` | DELETE | `/trust-policies/{policy_id}` | нет |
    | `crane:favorite` | PUT | `/me/favorites/{format}/{repository}/{name}` | нет |
    | `crane:unfavorite` | DELETE | `/me/favorites/{format}/{repository}/{name}` | нет |
    | `crane:deprecate` | POST | `/packages/{format}/{repository}/{name}/deprecation` | `DeprecationBody` |
    | `crane:undeprecate` | DELETE | `/packages/{format}/{repository}/{name}/deprecation` | нет |
    | `crane:yank` | PUT | `/packages/{format}/{repository}/{name}/versions/{version}/yank` | нет |
    | `crane:unyank` | DELETE | `/packages/{format}/{repository}/{name}/versions/{version}/yank` | нет |
    | `crane:unlist` | PUT | `/packages/{format}/{repository}/{name}/versions/{version}/unlist` | нет |
    | `crane:relist` | DELETE | `/packages/{format}/{repository}/{name}/versions/{version}/unlist` | нет |
    | `crane:set-dist-tag` | PUT | `/packages/{format}/{repository}/{name}/dist-tags/{tag}` | `DistTagBody` |
    | `crane:delete` | POST | `/packages/{format}/{repository}/{name}/versions/{version}/deletion` | `DeleteVersionBody` |
    | `crane:request-approval` | POST | `/packages/{format}/{repository}/{name}/versions/{version}/approval-requests` | `ApprovalRequestBody` |
    | `crane:promote` | POST | `/packages/{format}/{repository}/{name}/versions/{version}/promotions` | `PromoteBody` |
    | `crane:evaluate` | POST | `/packages/{format}/{repository}/{name}/versions/{version}/promotion/evaluations` | нет |
    | `crane:approve-request` | POST | `/approval-requests/{request_id}/approve` | `ApprovalDecision` |
    | `crane:reject-request` | POST | `/approval-requests/{request_id}/reject` | `ApprovalDecision` |
    | `crane:quarantine-release` | POST | `/packages/{format}/{repository}/{name}/versions/{version}/release` | нет |
    | `crane:quarantine-block` | POST | `/packages/{format}/{repository}/{name}/versions/{version}/block` | нет |
    | `crane:accept-vex` | POST | `/vex-statements` | `VexCreate` |
    | `crane:create-exception` | POST | `/exceptions` | `ExceptionCreate` |
    | `crane:create-issue` | POST | `/issues` | `IssueCreate` |
    | `crane:block` | POST | `/emergency-blocks` | `EmergencyBlockCreate` |
    | `crane:lift-block` | POST | `/emergency-blocks/{block_id}/lift` | `LiftBody` |
    | `crane:revoke-exception` | POST | `/exceptions/{exception_id}/revoke` | нет |
    | `crane:decide` | POST | `/license-reviews/{review_id}/decision` | `LicenseReviewDecision` |
    | `crane:create-break-glass` | POST | `/break-glass-grants` | `BreakGlassCreate` |
    | `crane:approve-break-glass` | POST | `/break-glass-grants/{grant_id}/approve` | нет |
    | `crane:reject-break-glass` | POST | `/break-glass-grants/{grant_id}/reject` | `ApprovalDecision` |
    | `crane:revoke-break-glass` | POST | `/break-glass-grants/{grant_id}/revoke` | `RevokeBody` |
    | `crane:create-advisory` | POST | `/advisories` | `AdvisoryCreate` |
    | `crane:update-license-policy` | PUT | `/license-policy` | `LicensePolicyUpdate` |
    | `crane:update-vulnerability-policy` | PUT | `/vulnerability-policy` | `VulnerabilityPolicyUpdate` |
    | `crane:update-gates` | PUT | `/gates` | `GatesConfigUpdate` |
    | `crane:reveal` | POST | `/audit/events/{event_id}/reveal` | `RevealBody` |
    | `crane:create-audit-export` | POST | `/audit/exports` | `AuditExportCreate` |
    | `crane:create-audit-integrity-check` | POST | `/audit/integrity-checks` | нет |
    | `crane:create-siem-sink` | POST | `/siem/sinks` | `SiemSinkCreate` |
    | `crane:update-siem-sink` | PATCH | `/siem/sinks/{sink_id}` | `SiemSinkCreate` |
    | `crane:create-compliance-report` | POST | `/compliance-reports` | `ComplianceReportCreate` |
    | `crane:create-repository` | POST | `/repositories` | `RepositoryCreate` |
    | `crane:update-repository` | PATCH | `/repositories/{format}/{repository}` | `RepositoryPatch` |
    | `crane:update-repository-protection` | PUT | `/repositories/{format}/{repository}/protection` | `RepositoryProtection` |
    | `crane:purge-cache` | POST | `/repositories/{format}/{repository}/cache/purge` | нет |
    | `crane:run` | POST | `/retention/runs` | `RetentionRun` |
    | `crane:create-retention-rule` | POST | `/retention/rules` | `RetentionRuleCreate` |
    | `crane:create-retention-hold` | POST | `/retention/holds` | `RetentionHoldCreate` |
    | `crane:create-integrity-check` | POST | `/storage/integrity-checks` | нет |
    | `crane:create-storage-move` | POST | `/storage/moves` | `StorageMoveCreate` |
    | `crane:update-quota` | PATCH | `/quotas/{workspace}` | `QuotaPatch` |
    | `crane:retry` | POST | `/jobs/{job_id}/retry` | нет |
    | `crane:create-import` | POST | `/imports` | `ImportCreate` |
    | `crane:create-workspace` | POST | `/workspaces` | `WorkspaceCreate` |
    | `crane:create-webhook` | POST | `/webhooks` | `WebhookCreate` |
    | `crane:redeliver` | POST | `/webhooks/{webhook_id}/deliveries/{delivery_id}/redeliver` | нет |
    | `crane:check-readiness` | POST | `/readiness` | `UploadBody` |
    | `crane:warm-cache` | POST | `/cache/warmups` | `UploadBody` |
    | `crane:mark-read` | POST | `/notifications/{notification_id}/read` | нет |
    | `crane:mark-all-read` | POST | `/notifications/read-all` | `ReadAllBody` |
    | `crane:confirm-plan` | POST | `/agent-plans/{confirmation_id}/confirm` | нет |
    | `crane:reject-plan` | POST | `/agent-plans/{confirmation_id}/reject` | нет |

    Навигация строится по `_links` ответа `GET /me` (`crane:search`, `crane:my-tokens`, `crane:my-actions`, `crane:findings`, `crane:audit-events`, `crane:platform-overview`, …): ссылка есть, только если раздел разрешён.

    ## Живые данные

    Только опрос с ETag и 304 и `Cache-Control: private, max-age=<каденс>`. SSE не используется: BFF работает на нескольких репликах, SSE требует фан-аута через Valkey и липких соединений; каденс не короче 15 с, поэтому выигрыш нулевой. A2A-стриминг - отдельный протокол. Каденсы: `/status` 30 с; плитки и компоненты обзора 15 с; графики 60 с; `/findings/summary` 30 с; `/license-reviews/summary` 30 с; `/notifications` и `/notifications/unread-count` 60 с. На скрытой вкладке опрос приостанавливается; есть кнопка «Пауза автообновления».

    ## Командная палитра

    Отдельного API нет (P0, v0.4.0). Пакеты - `GET /search?limit=8&fields=purl_base,name,format`; навигация и действия строятся на клиенте по `_links` ответа `GET /me`.

    ## Сессия

    `GET /session` отдаёт `csrf_token`. Вход: `GET /session/login` (302 в Keycloak, Authorization Code + PKCE), `GET /session/callback` (302), `POST /session/logout`, step-up `GET /session/step-up?acr=mfa`. 401 сессии несёт `reason` из `session_expired`, `session_revoked`, `session_elsewhere`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://crane.example/api/v1
  description: Экземпляр CRANE
security:
- session: []
tags:
- name: session
  description: 'Вход и сессия BFF: Authorization Code + PKCE, cookie, step-up, конфигурация входа для CLI.'
- name: me
  description: Профиль, избранное, недавние, мои пакеты и мои действия.
- name: catalog
  description: 'Поиск, пакеты и версии: карточки, состояния, флаги формата, deprecate, yank, удаление.'
- name: access
  description: Токены, роботы, trust policies, пространства имён, доступ команды, обмен токенов.
- name: promotion
  description: Продвижение версий, гейты, approvals, evidence.
- name: vulnerabilities
  description: Находки, бюллетени, фиды, VEX, исключения, задачи, экстренные блокировки, break-glass, карантин,
    SOAR.
- name: licenses
  description: Лицензии версий, очередь проверки, лицензионная политика.
- name: audit
  description: Журнал действий, экспорт, целостность, SIEM, правила обнаружения, SoD, отчёты.
- name: platform
  description: Статус, обзор, хранилища, репозитории, upstream, квоты, retention, целостность, задачи, бэкапы, импорт,
    workspaces, интеграции, вебхуки.
- name: cache
  description: Готовность lockfile и SBOM к офлайну, прогрев кэша.
- name: diagnostics
  description: Трасса решения по request_id.
- name: notifications
  description: 'Центр уведомлений: список, счётчик непрочитанных, отметка прочитанным (P0).'
- name: agents
  description: Подтверждения планов A2A-агента (P3).
paths:
  /status:
    $ref: ./common.yaml#/components/pathItems/Status
  /tokens:
    $ref: ./common.yaml#/components/pathItems/Tokens
  /tokens/policy:
    $ref: ./common.yaml#/components/pathItems/TokensPolicy
  /tokens/{token_id}:
    $ref: ./common.yaml#/components/pathItems/TokensTokenId
  /tokens/{token_id}/revoke:
    $ref: ./common.yaml#/components/pathItems/TokensTokenIdRevoke
  /diagnostics/{request_id}:
    $ref: ./common.yaml#/components/pathItems/DiagnosticsRequestId
  /search:
    $ref: ./common.yaml#/components/pathItems/Search
  /packages/{format}/{repository}/{name}:
    $ref: ./common.yaml#/components/pathItems/PackagesFormatRepositoryName
  /packages/{format}/{repository}/{name}/versions:
    $ref: ./common.yaml#/components/pathItems/PackagesFormatRepositoryNameVersions
  /packages/{format}/{repository}/{name}/versions/{version}:
    $ref: ./common.yaml#/components/pathItems/PackagesFormatRepositoryNameVersionsVersion
  /packages/{format}/{repository}/{name}/versions/{version}/deletion:
    $ref: ./common.yaml#/components/pathItems/PackagesFormatRepositoryNameVersionsVersionDeletion
  /packages/{format}/{repository}/{name}/versions/{version}/promotion:
    $ref: ./common.yaml#/components/pathItems/PackagesFormatRepositoryNameVersionsVersionPromotion
  /packages/{format}/{repository}/{name}/versions/{version}/promotions:
    $ref: ./common.yaml#/components/pathItems/PackagesFormatRepositoryNameVersionsVersionPromotions
  /robots:
    $ref: ./common.yaml#/components/pathItems/Robots
  /robots/{robot_id}:
    $ref: ./common.yaml#/components/pathItems/RobotsRobotId
  /robots/{robot_id}/credentials:
    $ref: ./common.yaml#/components/pathItems/RobotsRobotIdCredentials
  /robots/{robot_id}/disable:
    $ref: ./common.yaml#/components/pathItems/RobotsRobotIdDisable
  /readiness:
    $ref: ./common.yaml#/components/pathItems/Readiness
  /cache/warmups:
    $ref: ./common.yaml#/components/pathItems/CacheWarmups
  /audit/exports:
    $ref: ./common.yaml#/components/pathItems/AuditExports
  /audit/exports/{export_id}:
    $ref: ./common.yaml#/components/pathItems/AuditExportsExportId
  /audit/anchors:
    $ref: ./common.yaml#/components/pathItems/AuditAnchors
  /session:
    get:
      tags:
      - session
      summary: Состояние сессии
      description: 'Роли: любой (в т.ч. без сессии: `authenticated=false`).'
      operationId: getSession
      x-crane-phase: P0
      x-crane-since: v0.4.0
      x-crane-action: session:read
      x-crane-step-up: false
      x-crane-audit: null
      security:
      - {}
      - session: []
      - bearer: []
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-Id:
              $ref: ./common.yaml#/components/headers/XRequestId
          content:
            application/hal+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Session
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./common.yaml#/components/responses/InternalError
  /session/login:
    get:
      tags:
      - session
      summary: Начать вход
      description: |-
        Authorization Code + PKCE (S256) в Keycloak (клиент `crane-web`). Ответ 302.

        Роли: не требуется.
      operationId: loginSession
      x-crane-phase: P0
      x-crane-since: v0.4.0
      x-crane-action: session:login
      x-crane-step-up: false
      x-crane-audit:
        event: auth.login_started
        ocsf_class: 3002
