# Окно сборки — между тегами (предыдущий v* .. новый тег). Запуск: pnpm exec git-cliff --help
[changelog]
header = """
# Журнал изменений

Формат — [Conventional Commits](https://www.conventionalcommits.org/ru/v1.0.0/), версии — [SemVer](https://semver.org/lang/ru/).

"""
body = """
{% if version %}\
## [{{ version }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Не выпущено
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} **[BREAKING]**{% endif %} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "Возможности" },
  { message = "^fix", group = "Исправления" },
  { message = "^perf", group = "Производительность" },
  { message = "^refactor", group = "Рефакторинг" },
  { message = "^docs", group = "Документация" },
  { message = "^(test|build|ci|style|chore|revert)", group = "Служебное" },
]
