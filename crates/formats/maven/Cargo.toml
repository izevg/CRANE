[package]
name = "crane-format-maven"
description = "Протокол Maven-репозитория."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crane-domain = { path = "../../core/domain" }
# Суммы документов metadata (`maven-metadata.xml.sha1`, `.sha256`, `.sha512`) считаются по сгенерированным байтам.
# MD5 нужен только как контрольная сумма `.md5` Maven (не для безопасности); версия та же, что в crane-ports.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
# Календарь для `lastUpdated`; версия и крейт те же, что у crane-pg.
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
# Контракт Ecosystem — исполняемая спецификация, общая для всех форматов.
crane-ports = { path = "../../core/ports", features = ["contract"] }
# Только для построения VersionId/RepositoryId в тестах; в рабочий код не попадает.
uuid = "1"
