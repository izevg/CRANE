[package]
name = "crane-server"
description = "Composition root и точка входа сервера: роли serve, worker, analyze, all, migrate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "crane"
path = "src/main.rs"

[dependencies]
crane-app = { path = "../../core/app" }
crane-domain = { path = "../../core/domain" }
crane-http = { path = "../http" }
crane-memory = { path = "../../adapters/persistence/memory" }
crane-ports = { path = "../../core/ports" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
uuid = { version = "1", features = ["v7"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
