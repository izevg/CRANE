[package]
name = "crane-http"
description = "Driving-адаптер HTTP: routers, middleware, problem+json."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crane-app = { path = "../../core/app" }
crane-domain = { path = "../../core/domain" }
crane-ports = { path = "../../core/ports" }
crane-format-cargo = { path = "../../formats/cargo" }
axum = { version = "0.8", default-features = false, features = ["tokio"] }
axum-extra = { version = "0.12", default-features = false, features = ["typed-header"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
# timeout для пробы готовности: зависшее хранилище не должно держать пробу дольше клиента.
tokio = { version = "1", default-features = false, features = ["time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
crane-memory = { path = "../../adapters/persistence/memory" }
crane-siem = { path = "../../adapters/external/siem" }
http-body-util = "0.1"
tokio = { version = "1", default-features = false, features = ["rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
