[package]
name = "crane-http"
description = "Driving-адаптер HTTP: routers, middleware, problem+json."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crane-app = { path = "../../core/app" }
crane-domain = { path = "../../core/domain" }
crane-ports = { path = "../../core/ports" }
crane-format-cargo = { path = "../../formats/cargo" }
crane-format-npm = { path = "../../formats/npm" }
crane-format-pypi = { path = "../../formats/pypi" }
axum = { version = "0.8", default-features = false, features = ["tokio"] }
axum-extra = { version = "0.12", default-features = false, features = ["typed-header"] }
# Basic-схема (pip, Maven, dotnet): пароль приходит в base64. Версия та же, что у crane-format-npm.
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Загрузка PyPI: часть `content` должна стать потоком `'static` для `Registry::attach`, а `Field` из
# `axum::extract::Multipart` заимствует форму. multer — движок axum multipart (MIT), без json и tokio-io.
multer = { version = "3", default-features = false }
serde_json = "1"
sha2 = "0.10"
# time: timeout пробы готовности (зависшее хранилище не держит пробу дольше клиента).
# rt: `tokio::spawn` для фоновой ревалидации proxy, которую handler обязан запустить сам.
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
crane-memory = { path = "../../adapters/persistence/memory" }
crane-siem = { path = "../../adapters/external/siem" }
http-body-util = "0.1"
tokio = { version = "1", default-features = false, features = ["rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
