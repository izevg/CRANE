[package]
name = "crane-objstore"
description = "Адаптер объектного хранилища."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
crane-domain = { path = "../../../core/domain" }
crane-ports = { path = "../../../core/ports" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
object_store = { version = "0.14", features = ["aws"] }
sha2 = "0.10"
# Только AsyncWriteExt::shutdown для BufWriter: другого способа завершить загрузку у него нет.
tokio = { version = "1", default-features = false, features = ["io-util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
crane-ports = { path = "../../../core/ports", features = ["contract"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
