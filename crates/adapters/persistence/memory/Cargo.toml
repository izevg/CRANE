[package]
name = "crane-memory"
description = "In-memory адаптер портов для тестов ядра."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
crane-domain = { path = "../../../core/domain" }
crane-ports = { path = "../../../core/ports" }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Кэш proxy в single-node ограничен по байтам: без вытеснения документы до 64 МиБ копились бы вечно.
# Синхронный вариант: порты отдают готовые футуры, async-рантайм кэшу не нужен.
moka = { version = "0.12", features = ["sync"] }
uuid = "1"

[dev-dependencies]
crane-ports = { path = "../../../core/ports", features = ["contract"] }
futures-executor = "0.3"
