name: Release

# Слияние release/vX.Y.Z → main: бамп версий, CHANGELOG (окно «предыдущий тег..HEAD»), коммит, тег vX.Y.Z.
# Запись в защищённую main идёт от GitHub App (bypass); тег от App запускает workflow publish.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          # Токен App не остаётся в .git/config: его видел бы каждый следующий шаг и каждый сторонний action.
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Бамп, CHANGELOG, коммит, тег
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          tag="${HEAD_REF#release/}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "Тег $tag уже существует"; exit 1; fi
          node tools/bump-version.ts "$tag"
          cargo update --workspace
          pnpm exec git-cliff --tag "$tag" --output CHANGELOG.md
          git config user.name "crane-release[bot]"
          git config user.email "crane-release[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): $tag"
          git tag -a "$tag" -m "$tag"
          # Токен передаётся только этой команде, через заголовок, и не попадает в конфигурацию репозитория.
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin main "$tag"
