name: Publish

# Тег v* → GitHub Release с заметками из CHANGELOG (тот же диапазон, что и в CHANGELOG.md).
# Образы в ghcr пока не собираются.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Создать Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pnpm exec git-cliff --latest --strip header --output notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
