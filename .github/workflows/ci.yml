name: CI

on:
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Пока репозиторий приватный, минуты Actions платные, а каждая джоба округляется
  # вверх до минуты. Поэтому PR в release/* получает одну дешёвую джобу: направление,
  # заголовок, атрибуция. Сборка и тесты уже прошли локально (lefthook, task check),
  # в CI они идут только на релизный PR в main — один раз на веху (DEBT 16).
  pr:
    name: pr
    runs-on: ubuntu-latest
    steps:
      - name: Проверить направление PR
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            [[ "$HEAD" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "В main принимаются только release/vX.Y.Z (получено: $HEAD)"; exit 1; }
          else
            [[ "$HEAD" =~ ^release/ ]] && { echo "В release/* принимаются feature-ветки, не release"; exit 1; }
          fi
          echo "ok: $HEAD → $BASE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: "${{ github.base_ref == 'main' && '0' || '1' }}" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Заголовок PR — Conventional Commits (он станет сообщением сквоша)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
      - name: Запрет атрибуции ИИ в описании PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf 'chore: check\n\n%s\n' "$PR_BODY" | pnpm exec commitlint
      # Полный гейт — один раз на веху, перед слиянием релиза в main (GITFLOW.md).
      - name: Отметка о локальном мутационном гейте (task gate)
        if: github.base_ref == 'main'
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha="$(printf '%s\n' "$BODY" | sed -n 's/^Gate-SHA: *\([0-9a-f]\{40\}\).*/\1/p' | head -1)"
          printf '%s\n' "$BODY" | grep -q '^Gate: passed' || { echo "В описании PR нет «Gate: passed» (запустите task gate)"; exit 1; }
          [ -n "$sha" ] || { echo "В описании PR нет «Gate-SHA: <40 hex>»"; exit 1; }
          # task gate печатает git rev-parse HEAD: гейт относится ровно к проверяемому коммиту, а не к любому предку
          # (иначе Gate-SHA: <sha main> проходит без запуска гейта). После новых коммитов гейт повторяется (GITFLOW.md).
          [ "$sha" = "$HEAD_SHA" ] \
            || { echo "Gate-SHA $sha не равен голове PR $HEAD_SHA (повторите task gate на последнем коммите)"; exit 1; }

  structure:
    name: structure
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:tools
      - name: Правило четырёх и слои крейтов
        run: pnpm run lint:structure
      - name: Реестр заглушек FIXME
        run: pnpm run lint:fixme
      - name: Compose-файлы и Helm-чарт
        run: |
          docker compose --project-directory . --env-file .env.dist -f deploy/compose/docker-compose.yaml -f deploy/compose/docker-compose.cache.yaml --profile scan --profile s3 config -q
          docker compose --project-directory . --env-file .env.dist -f deploy/compose/docker-compose.dev.yaml --profile s3 --profile scan config -q
          helm lint deploy/helm/crane --set existingSecret=crane-env
          helm template crane deploy/helm/crane --set existingSecret=crane-env --set ingress.enabled=true >/dev/null

  rust:
    name: rust
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  web:
    name: web
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: typecheck, biome, steiger, knip, depcruise
        run: pnpm --filter web run check
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web run test
