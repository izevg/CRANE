[workspace]
resolver = "3"
# Крейты добавляются явно: группы каталогов (core/, formats/, adapters/*/) не являются пакетами.
# Имена: core/X, adapters/*/X, entry/X → crane-X; formats/X → crane-format-X.
members = [
  "crates/core/domain",
  "crates/core/ports",
  "crates/core/app",
  "crates/core/access",
  "crates/formats/maven",
  "crates/formats/npm",
  "crates/formats/pypi",
  "crates/formats/nuget",
  "crates/formats/cargo",
  "crates/adapters/persistence/pg",
  "crates/adapters/persistence/valkey",
  "crates/adapters/persistence/objstore",
  "crates/adapters/persistence/memory",
  "crates/adapters/identity/keycloak",
  "crates/adapters/identity/gitlab",
  "crates/adapters/external/upstream",
  "crates/adapters/external/trivy",
  "crates/adapters/external/feeds",
  "crates/adapters/external/siem",
  "crates/adapters/intelligence/systemone",
  "crates/adapters/intelligence/llm",
  "crates/entry/http",
  "crates/entry/worker",
  "crates/entry/analyzer",
  "crates/entry/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/izevg/CRANE"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
