# Локальная разработка: только зависимости, сам CRANE запускается с хоста (`cargo run`).
# Значения берутся из .env (cp .env.dist .env); порты публикуются на ${DEV_BIND}.
#   docker compose -f docker-compose.dev.yaml up -d
#   CRANE_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}
name: crane-dev

services:
  postgres:
    image: ${POSTGRES_IMAGE:?}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports: ["${DEV_BIND:?}:${POSTGRES_PORT:?}:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: ${VALKEY_IMAGE:?}
    # Кэш эфемерный: персистентность не нужна.
    command: ["--save", "", "--appendonly", "no"]
    ports: ["${DEV_BIND:?}:${VALKEY_PORT:?}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое хранилище blobs. Без профиля не нужно: достаточно CRANE_BLOBS=file://./.data/blobs.
  seaweedfs:
    profiles: [s3]
    image: ${SEAWEEDFS_IMAGE:?}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    ports: ["${DEV_BIND:?}:${SEAWEEDFS_S3_PORT:?}:8333"]
    volumes: [blobs:/data]

  # Сервер Trivy для analyzer.
  trivy:
    profiles: [scan]
    image: ${TRIVY_IMAGE:?}
    command: ["server", "--listen", "0.0.0.0:4954"]
    ports: ["${DEV_BIND:?}:${TRIVY_PORT:?}:4954"]
    volumes: [trivy:/root/.cache/trivy]

volumes:
  pg:
  blobs:
  trivy:
